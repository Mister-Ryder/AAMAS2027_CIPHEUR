[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipheur"
version = "0.2.0"
description = "Certified evidence-guided joint graph-feature and ranking-rule synthesis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
v51 = ["numpy>=1.24"]
analysis = ["numpy>=1.24", "matplotlib>=3.7", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.0"]

[project.scripts]
cipheur = "cipheur.__main__:main"

[tool.setuptools.packages.find]
include = ["cipheur*"]
